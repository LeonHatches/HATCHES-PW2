{% load static %}
{% static "images" as baseUrl %}

<!DOCTYPE html>
<html>
<head>
    <title>Iniciar Sesión</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Travello Login">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/bootstrap4/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/main_styles.css' %}">
    <link rel="stylesheet" href="{% static 'styles/form.css' %}">
</head>

<body class="bg-light d-flex justify-content-center align-items-center" style="background-image: url('{% static 'images/testimonials.jpg' %}');">
    <div class="w-100" style="max-width: 400px;">

        {% include "header.html" %}

        <div>

            <div class="mb-3">
                {% for message in messages %}
                <div class="alert alert-danger text-center"> {{message}} </div>
                {% endfor %}
            </div>

            <div class="card shadow p-4 bg-white rounded">
                <form method="post" action="login">
                    {% csrf_token %}
                    <h3 class="text-center mb-4" style="color: #013252;">Iniciar Sesión</h3>

                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" name="username" class="form-control"  style="color: black;" placeholder="Ingresa tu usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" class="form-control" style="color: black;" placeholder="Ingresa tu contraseña" required>
                    </div>

                    <div>
                        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
