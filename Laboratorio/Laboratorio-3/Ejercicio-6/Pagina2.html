<!--
    El problema nos pide una calculadora que trabaje con dos argumentos y realice
    operaciones aritméticas, lógicas y de bits básicas.

    La solución será utilizar varias funciones. Primero tener dos inputs para los
    valores y un select para el operador. Luego, un verificador. Después, las
    operaciones correspondientes y posiblemente con un return. Tomar en cuenta casos
    excepcionales como en la división.
-->

<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Calculadora</title>
	</head>

	<body>
		<h1>Calculadora</h1>
		
		<div>
			<p>Ingrese dos valores. Números para aritmética y binarias; "V" y "F" para lógicas:</p>
			
			<!--Variable-->
			<input type="text" id="argumento1">
			
			<!--Operador-->
			<select id="operador">
				<option value="+">+</option>
				<option value="-">-</option>
				<option value="*">x</option>
				<option value="/">/</option>
				<option value="**">**</option>
				<option value="%">mod</option>
				<option value="&&">&&</option>
				<option value="||">||</option>
				<option value="!">~</option>
				<option value="AND">AND</option>
				<option value="OR">OR</option>
				<option value="XOR">XOR</option>
				<option value="NOT">NOT</option>
			</select>
			
			<!--Variable-->
			<input type="text" id="argumento2">

			<button onclick="calcular()">Calcular</button>
		</div>

		<p>Resultado:</p>
		<div id="resultado"></div>

		<script>
			// Resultado a usar en las funciones
			let resultado;

			// Para verificar en la función verificar()
			const OP_BITS = ["OR", "AND", "XOR"];
			const OP_MATH = ["+", "-", "*", "/", "**", "%"];
			const OP_LOG  = ["&&", "||"];
			const ERROR   = "Ingrese argumentos válidos.";

			function calcular () {

				const argumento1 = document.getElementById("argumento1").value;
				const argumento2 = document.getElementById("argumento2").value;
				const operador   = document.getElementById("operador").value;

				verificar(argumento1, argumento2, operador);
			}

			function verificar (argumento1, argumento2, operador) {

				// Si ambos son bits
				if (   !isNaN(parseInt(argumento1, 2))
					&& !isNaN(parseInt(argumento2, 2)) && OP_BITS.includes(operador) ) {
					operacionBits(argumento1, argumento2, operador);
				}

				// Si se desea una negatividad de Bits
				else if (isEmpty(argumento1) && !isNaN(parseInt(argumento2, 2)) && operador === "NOT") {
					operacionBitsNegativa(argumento2);
				}

				// Si ambos son números
				else if ( !isNaN(Number(argumento1)) && !isNaN(Number(argumento2)) && OP_MATH.includes(operador)) {
					operacionNumerica(argumento1, argumento2, operador);
				}

				// Si se desea un negativo de un booleano
				else if (isEmpty(argumento1) && isBoolean(argumento2) && operador === "!") {
					operacionLogicaNegativa(argumento2);
				}

				// Si ambos son datos booleanos
				else if (isBoolean(argumento1) && isBoolean(argumento2) && OP_LOG.includes(operador)) {
					operacionLogica(argumento1, argumento2, operador);
				}

				// Si no se cumple ninguna de las operaciones
				else {
					mostrar(ERROR);
				}
			}

			function operacionBits (argumento1, argumento2, operador) {
				
				let bits1 = parseInt(argumento1, 2);
				let bits2 = parseInt(argumento2, 2);

				switch (operador) {
					case "OR":
						resultado = bits1 | bits2; break;

					case "AND":
						resultado = bits1 & bits2; break;

					case "XOR":
						resultado = bits1 ^ bits2; break;
				}

				mostrar(resultado.toString(2));
			}

			function operacionNumerica (argumento1, argumento2, operador) {
				
				let numero1 = parseInt(argumento1);
				let numero2 = parseInt(argumento2);

				switch (operador) {
					case "+":
						resultado = numero1 + numero2; break;

					case "-":
						resultado = numero1 - numero2; break;

					case "*":
						resultado = numero1 * numero2; break;

					case "/":

						if (numero2 == 0)
							resultado = ERROR;
						else
							resultado = numero1 / numero2;

						break;

					case "**":
						resultado = numero1 ** numero2; break;

					case "%":

						if (numero2 == 0)
							resultado = ERROR;
						else
							resultado = numero1 % numero2;

						break;
				}

				mostrar(resultado);
			}

			function operacionBitsNegativa (argumento2) {
				
				let resultado = "";

				for (let x of argumento2) {

					if (x == "0")
						resultado += "1";
					else
						resultado += "0";
				}

				mostrar(resultado);
			}

			function isBoolean (valor) {
				
				valor = valor.toUpperCase();
				return (valor == "V" || valor == "F");
			}

			function parseBoolean (valor) {
				return (valor == "V") ? true : false;
			}

			function isEmpty (cadena) {
				return cadena.length === 0;
			}

			function mostrar (mensaje) {
				document.getElementById("resultado").innerHTML = mensaje;
			}

		</script>
	</body>
</html>
