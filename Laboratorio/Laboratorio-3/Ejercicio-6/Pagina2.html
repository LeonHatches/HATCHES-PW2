<!--
    El problema nos pide una calculadora que trabaje con dos argumentos y realice
    operaciones aritméticas, lógicas y de bits básicas.

    La solución será utilizar varias funciones. Primero tener dos inputs para los
    valores y un select para el operador. Luego, un verificador. Después, las
    operaciones correspondientes y posiblemente con un return. Tomar en cuenta casos
    excepcionales como en la división.
-->

<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Calculadora</title>
	</head>

	<body>
		<h1>Calculadora</h1>
		
		<div>
			<p>Ingrese dos valores. Números para aritmética y binarias; "True" y "False" para lógicas:</p>
			
			<!--Variable-->
			<input type="text" id="argumento1">
			
			<!--Operador-->
			<select>
				<option value="+">+</option>
				<option value="-">-</option>
				<option value="*">x</option>
				<option value="/">/</option>
				<option value="**">**</option>
				<option value="%">mod</option>
				<option value="&&">&&</option>
				<option value="||">||</option>
				<option value="!">~</option>
				<option value="AND">AND</option>
				<option value="OR">OR</option>
				<option value="XOR">XOR</option>
				<option value="NOT">NOT</option>
				<option value="<<"><<</option>
				<option value=">>">>></option>
			</select>
			
			<!--Variable-->
			<input type="text" id="argumento2">

			<button onclick="">Calcular</button>
		</div>

		<script>
		</script>
	</body>
</html>
