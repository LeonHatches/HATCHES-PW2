<!--
    El problema nos pide un texto que pueda cambiar de tamaño con dos botones
    de (+) y (-), también implementarlo para que pueda cambiar de color.

    La solución es trabajar con ids, luego obtener el valor del texto con el
    document.getElementById y cambiar con .style, los dos valores (de texto y
    de color).
-->

<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Texto Mágico</title>
	</head>

	<body>
		<h1>El Texto Mágico</h1>
		<p id="texto">Este párrafo es mágico...</p>

		<div>
			<button onclick="aumentar()">+</button>
			<button onclick="reducir()">-</button>
			<button onclick="color()">Cambiar Color</button>
		</div>

		<script>

			const COLORES = ["red", "green", "blue", "black", "orange", "Violet"];

			function color () {
				document.getElementById("texto").style.color = COLORES[random()];
			}

			function random () {
				return Math.floor(Math.random() * 6);
			}

		</script>
	</body>
</html>
