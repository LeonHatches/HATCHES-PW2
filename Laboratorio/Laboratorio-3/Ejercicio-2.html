<!--
    El problema nos pide una página que reciba un texto y con un boton que de a
    una función, lo devuelva invertido en otro div.

    La solución será agregar un input tipo texto y que al darle al botón con el
    onclick pueda retornar el texto invertido.
-->

<!DOCTYPE html>
<html>
	<head>
		<title>Palabra Invertida</title>
	</head>

	<body>
		<h1>Palabra Invertida</h1>

		<label for = "palabra">Ingrese la palabra a invertir:</label>
		<input type = "text" id = "palabra">
		
		<button onclick = "palabraInvertir()">Invertir</button>

		<div id = "invertir"><div>
	</body>
</html>
