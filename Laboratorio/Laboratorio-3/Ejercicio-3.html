<!--
    El problema nos pide calcular cuantos días faltan para el dia de Arequipa

    La solución será restar las dos fechas, teniendo en cuenta que el año del
    aniversario debe ser igual al actual si esta fecha es menor, sin embargo,
    si esta es mayor, se deberá tomar la del año siguiente (deberá haber un
    if que compare las dos fechas), luego de que tengamos la fecha del
    aniversario definida deberemos restar y convertir el resultado (que está
    en milisegundos) a días. Por ultimo usar un innerHTML para mostrar
    resultados.
-->

<!DOCTYPE html>
<html>
	<head>
		<title>Día de Arequipa</title>
	</head>

	<body>
		<script>

			function calcularDia() {

				// Fecha Actual
				const actual = new Date(2025, 7, 16);         // Fecha de prueba por Commit
				let year = actual.getFullYear(), restante;

				// Verificación por si se pasa el aniversario
				if (actual > new Date(year, 7, 15) ) {
					year += 1;
				}

				// Aniversario Verificado
				const aniversario = new Date(year, 7, 15);

				restante = aniversario - actual;

				console.log(aniversario.toString());
				console.log(actual.toString());
				console.log(restante);
			}

			calcularDia();

		</script>
	</body>
</html>
