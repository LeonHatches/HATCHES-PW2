<!--
    El problema nos pide una página al que le ingresemos un link de Google Meet
    y nos devuelva la palabra sin separadores (el "-").

    La solución será por medio de un input, ingresar este código y por un botón
    que llame a la función que primero, va verificar si es accesible contando
    la cantidad de dígitos que debería tener (length) y que solo tenga dos guiones.
    (match) Después de verificar llamará a otra función que pueda cambiar los
    guiones (replace) a "".
-->

<!DOCTYPE html>
<html>
	<head>
		<title>Código de Meet</title>
	</head>

	<body>
		<h1>Generador de Códigos de Google Meet</h1>

		<label for="link">Ingrese el código con separadores:</label>
		<input type="text" id="link">
		<button onclick="verificar()">Enviar</button>

		<h2>El código limpio es:</h2>
		<p id="codigo"></p>

		<script>

			function verificar() {

				let cadena  = document.getElementById("link").value;
				let mensaje = "Verifique el código ingresado.";

				let match = cadena.match(/-/g);

				// Verificador de cantidad de caracteres y guiones
				if (cadena.length === 12 && match && match.length == 2) {
					mensaje = reemplazar(cadena);
				}

				mostrar(mensaje);
			}

			function reemplazar (cadena) {
				cadenaModificada = cadena.replace(/-/g, "");
				return cadenaModificada;
			}

			function mostrar (mensaje) {
				document.getElementById("codigo").innerHTML = mensaje;
			}

		</script>
	</body>
</html>
